name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package.json
      - name: Remove obsolete npm authentication setting
        run: |
          node -e 'const fs = require("node:fs"); const p = process.env.NPM_CONFIG_USERCONFIG; if (p && fs.existsSync(p)) fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace(/^always-auth\s*=.*\r?\n?/gm, ""));'
      - run: npm install --package-lock=false
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm run build
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
