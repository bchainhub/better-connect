name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package.json
      - name: Remove obsolete npm authentication setting
        run: |
          node -e 'const fs = require("node:fs"); const p = process.env.NPM_CONFIG_USERCONFIG; if (p && fs.existsSync(p)) fs.writeFileSync(p, fs.readFileSync(p, "utf8").replace(/^always-auth\s*=.*\r?\n?/gm, ""));'
      - run: npm install --package-lock=false
      - run: npm install -g npm@latest
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:package
